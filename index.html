<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>TESHIE TECH REELS</title><style>
:root{--gold:#e7b94f;--bg:#080808;--panel:#151515;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,Arial}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}.welcome{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 40%,#282012,#080808 65%);display:grid;place-content:center;text-align:center;padding:24px}.logo{width:116px;height:116px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 30px #e7b94f55}.welcome h1{font-size:24px;letter-spacing:2px;color:var(--gold);margin:18px 0 24px}.gold{background:var(--gold);color:#111;border-radius:28px;padding:12px 25px;font-weight:800}.app{display:none;max-width:560px;margin:auto;min-height:100dvh;padding-bottom:72px}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #252525;position:sticky;top:0;background:#080808ed;z-index:3}.brand{color:var(--gold);font-weight:900;letter-spacing:1px}.tabs{display:flex;gap:18px}.tabs button{color:#aaa}.tabs button.active{color:#fff;border-bottom:2px solid var(--gold);padding-bottom:5px}.feed{height:calc(100dvh - 130px);overflow:auto;scroll-snap-type:y mandatory}.post{height:calc(100dvh - 130px);min-height:480px;position:relative;scroll-snap-align:start;background:#111;display:grid;place-items:center}.post video{width:100%;height:100%;object-fit:contain;background:#050505}.overlay{position:absolute;bottom:18px;left:14px;right:76px;text-shadow:0 1px 4px #000}.actions{position:absolute;right:12px;bottom:24px;display:grid;gap:18px;text-align:center}.actions button{font-size:24px;display:grid;justify-items:center}.actions small{font-size:11px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:66px;background:#111;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:4}.nav button{display:grid;gap:3px;justify-items:center;color:#aaa;font-size:11px}.nav button.active{color:var(--gold)}.nav b{font-size:20px}.page{padding:18px}.card{background:var(--panel);border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}.field{width:100%;background:#080808;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.muted{color:var(--muted)}.videoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.videoGrid video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#222}.tag{color:var(--gold)}.empty{text-align:center;padding:50px 20px;color:#aaa}
</style></head><body>
<section class="welcome" id="welcome"><img class="logo" id="schoolLogo" alt="Teshie Technical Institute logo" src="school-logo.jpg" onerror="this.style.display='none'"><h1>TESHIE TECH REELS</h1><p class="muted">Your school. Your creativity. Your community.</p><button class="gold" id="enter">ENTER REELS</button><p class="muted" style="font-size:11px;margin-top:24px">A community made for creators</p></section>
<main class="app" id="app"><header class="top"><span class="brand">TTR ✦</span><div class="tabs"><button class="active" data-feed="forYou">For You</button><button data-feed="following">Following</button></div><button id="accountBtn">Sign in</button></header><section id="feed" class="feed"></section><section id="discover" class="page hidden"><h2>Discover</h2><input class="field" id="search" placeholder="Search creators or #hashtags"><div id="discoverResults"></div><h3>Trending tags</h3><div class="row" id="tags"></div></section><section id="activity" class="page hidden"><h2>Activities</h2><div id="activityList" class="card muted">Your likes, follows and comments will appear here.</div></section><section id="profile" class="page hidden"><div id="profileContent"></div></section><section id="upload" class="page hidden"><h2>Upload a video</h2><div class="card"><input id="videoFile" type="file" accept="video/*" class="field"><input id="caption" class="field" maxlength="180" placeholder="Write a caption..."><input id="hashtags" class="field" placeholder="Tags e.g. school, coding, teshie"><button class="gold" id="publish">Publish video</button><p class="muted" id="uploadStatus">Sign in to publish videos to the community.</p></div></section></main>
<nav class="nav hidden" id="nav"><button data-page="feed" class="active"><b>⌂</b>Home</button><button data-page="discover"><b>⌕</b>Discover</button><button data-page="upload"><b>＋</b>Upload</button><button data-page="activity"><b>♡</b>Activity</button><button data-page="profile"><b>◉</b>Profile</button></nav>
<div id="authModal" class="welcome hidden" style="background:#080808"><div class="card" style="width:min(420px,90vw);text-align:left"><h2 id="authTitle">Welcome back</h2><input id="authEmail" class="field" type="email" placeholder="Email"><input id="authPassword" class="field" type="password" placeholder="Password"><input id="authName" class="field" placeholder="Display name (for sign up)"><div class="row"><button class="gold" id="authSubmit">Sign in</button><button id="switchAuth">Create account</button><button id="closeAuth">Close</button></div><p class="muted" id="authMessage"></p></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL=window.TTR_SUPABASE_URL||'',SUPABASE_ANON_KEY=window.TTR_SUPABASE_ANON_KEY||'';
const supabase=SUPABASE_URL&&SUPABASE_ANON_KEY?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s);let user=null,posts=[],mode='signin',currentFeed='forYou';
$('#enter').onclick=()=>{$('#welcome').classList.add('hidden');$('#app').style.display='block';$('#nav').classList.remove('hidden');loadPosts();};
function notify(t){alert(t)}
async function loadPosts(){if(!supabase){$('#feed').innerHTML='<div class="empty"><h2>Welcome to Teshie Tech Reels</h2><p>Connect Supabase to activate shared videos and accounts.</p><button class="gold" id="loginPrompt">Sign in / Register</button></div>';$('#loginPrompt').onclick=openAuth;return}
let q=supabase.from('videos').select('id,user_id,video_url,caption,tags,created_at,profiles(username,display_name)').order('created_at',{ascending:false});if(currentFeed==='following'&&user){const {data:f}=await supabase.from('follows').select('following_id').eq('follower_id',user.id);q=q.in('user_id',(f||[]).map(x=>x.following_id))}const {data,error}=await q;if(error){$('#feed').innerHTML='<div class="empty">Could not load videos.</div>';return}posts=data||[];renderFeed()}
function renderFeed(){const f=$('#feed');f.innerHTML='';if(!posts.length){f.innerHTML='<div class="empty">No videos yet. Be the first to upload!</div>';return}posts.forEach(p=>{const el=document.createElement('article');el.className='post';const v=document.createElement('video');v.src=p.video_url;v.controls=true;v.playsInline=true;v.loop=true;v.preload='metadata';const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<b>@'+esc(p.profiles?.username||'creator')+'</b><p>'+esc(p.caption||'')+'</p><span class="tag">'+(p.tags||[]).map(t=>'#'+esc(t)).join(' ')+'</span>';const a=document.createElement('div');a.className='actions';a.innerHTML='<button data-act="like">♡<small>Like</small></button><button data-act="share">↗<small>Share</small></button><button data-act="download">⇩<small>Save</small></button><button data-act="tag">#<small>Tags</small></button>'+(user?.id===p.user_id?'<button data-act="delete">⌫<small>Delete</small></button>':'<button data-act="follow">＋<small>Follow</small></button>');a.onclick=e=>action(e,p);el.append(v,overlay,a);f.append(el)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function action(e,p){const b=e.target.closest('button');if(!b)return;const act=b.dataset.act;if(!user&&['like','delete','follow'].includes(act)){openAuth();return}if(act==='like'){const {data:old}=await supabase.from('likes').select('id').eq('video_id',p.id).eq('user_id',user.id).maybeSingle();if(old)await supabase.from('likes').delete().eq('id',old.id);else await supabase.from('likes').insert({video_id:p.id,user_id:user.id});b.firstChild.textContent=old?'♡':'♥'}if(act==='share'){if(navigator.share)await navigator.share({title:'Teshie Tech Reels',url:p.video_url});else{await navigator.clipboard.writeText(p.video_url);notify('Video link copied')}}if(act==='download'){const a=document.createElement('a');a.href=p.video_url;a.download='teshie-reel.mp4';a.target='_blank';a.click()}if(act==='tag')notify((p.tags||[]).map(t=>'#'+t).join(' ')||'No tags');if(act==='delete'&&confirm('Delete this video?')){const {error}=await supabase.from('videos').delete().eq('id',p.id);if(error)notify(error.message);else loadPosts()}if(act==='follow'){const {error}=await supabase.from('follows').insert({follower_id:user.id,following_id:p.user_id});if(error)notify(error.message);else notify('Following creator')}}
function openAuth(){$('#authModal').classList.remove('hidden')}
$('#accountBtn').onclick=openAuth;$('#closeAuth').onclick=()=>$('#authModal').classList.add('hidden');$('#switchAuth').onclick=()=>{mode=mode==='signin'?'signup':'signin';$('#authTitle').textContent=mode==='signin'?'Welcome back':'Create your account';$('#authSubmit').textContent=mode==='signin'?'Sign in':'Sign up';$('#authName').classList.toggle('hidden',mode==='signin');$('#switchAuth').textContent=mode==='signin'?'Create account':'I already have an account'};
$('#authSubmit').onclick=async()=>{if(!supabase){$('#authMessage').textContent='Backend is not connected yet. Follow the Supabase setup in README.';return}const email=$('#authEmail').value,password=$('#authPassword').value;let r=mode==='signup'?await supabase.auth.signUp({email,password,options:{data:{display_name:$('#authName').value}}}):await supabase.auth.signInWithPassword({email,password});$('#authMessage').textContent=r.error?.message||'Check your email if confirmation is enabled.';if(r.data.user){user=r.data.user;$('#accountBtn').textContent='Account';$('#authModal').classList.add('hidden');loadPosts();loadProfile()}};
if(supabase){const {data}=await supabase.auth.getSession();user=data.session?.user||null;supabase.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;$('#accountBtn').textContent=user?'Account':'Sign in';});}
$('#publish').onclick=async()=>{if(!supabase){notify('Connect Supabase first. See README.');return}if(!user){openAuth();return}const file=$('#videoFile').files[0];if(!file){notify('Choose a video first');return}if(file.size>100*1024*1024){notify('Please choose a video under 100 MB');return}$('#uploadStatus').textContent='Uploading...';const path=user.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let {error}=await supabase.storage.from('reels').upload(path,file,{contentType:file.type});if(error){$('#uploadStatus').textContent=error.message;return}const {data:pub}=supabase.storage.from('reels').getPublicUrl(path);const tags=$('#hashtags').value.split(/[ ,#]+/).filter(Boolean);({error}=await supabase.from('videos').insert({user_id:user.id,video_url:pub.publicUrl,caption:$('#caption').value,tags}));$('#uploadStatus').textContent=error?.message||'Video published!';if(!error){$('#videoFile').value='';$('#caption').value='';$('#hashtags').value='';showPage('feed');loadPosts()}};
function showPage(page){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));if(page==='feed'){$('#feed').classList.remove('hidden');$('#feed').style.display='block'}else{$('#'+page).classList.remove('hidden');$('#feed').style.display='none'}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{currentFeed=b.dataset.feed;document.querySelectorAll('[data-feed]').forEach(x=>x.classList.toggle('active',x===b));loadPosts()});
$('#search').oninput=async()=>{if(!supabase)return;const term=$('#search').value.replace(/^#/,'');const {data}=await supabase.from('videos').select('id,caption,tags,video_url,profiles(username)').or('caption.ilike.%'+term+'%,tags.cs.{'+term+'}').limit(20);$('#discoverResults').innerHTML=(data||[]).map(x=>'<div class="card">@'+esc(x.profiles?.username||'creator')+' — '+esc(x.caption||'')+'</div>').join('')||'<p class="muted">No matches</p>'};
async function loadProfile(){if(!supabase||!user)return;const {data:p}=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();const {count}=await supabase.from('videos').select('*',{count:'exact',head:true}).eq('user_id',user.id);$('#profileContent').innerHTML='<h2>'+(esc(p?.display_name||user.email))+'</h2><p class="muted">@'+esc(p?.username||'newcreator')+'</p><p>'+(count||0)+' videos</p><button class="gold" id="logout">Log out</button><div class="videoGrid" id="myVideos"></div>';$('#logout').onclick=async()=>{await supabase.auth.signOut();user=null;$('#accountBtn').textContent='Sign in';loadPosts();showPage('feed')};const {data:v}=await supabase.from('videos').select('video_url').eq('user_id',user.id);$('#myVideos').innerHTML=(v||[]).map(x=>'<video src="'+x.video_url+'" muted></video>').join('')}
$('#nav button[data-page="profile"]').addEventListener('click',loadProfile);$('#nav button[data-page="activity"]').onclick=async()=>{if(!user){$('#activityList').textContent='Sign in to view your activity.';return}const {data}=await supabase.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(30);$('#activityList').innerHTML=(data||[]).map(n=>'<p>'+esc(n.message)+'</p>').join('')||'No activity yet.'};
</script></body></html>
