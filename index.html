x;justify-items:center;color:#aaa;font-size:11px}.nav button.active{color:var(--gold)}.nav b{font-size:20px}.page{padding:18px}.card{background:var(--panel);border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}.field{width:100%;background:#080808;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.muted{color:var(--muted)}.videoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.videoGrid video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#222}.profile-tile{position:relative;padding:0;overflow:hidden;background:#222;aspect-ratio:9/14}.profile-tile video{width:100%;height:100%;object-fit:cover}.profile-tile span{position:absolute;left:8px;bottom:8px;text-shadow:0 1px 5px #000}.profile-feed-back{position:sticky;top:8px;z-index:5;margin:8px;padding:9px 14px;border-radius:20px;background:#111d;border:1px solid #ffffff33;color:#fff;font-weight:700;}.tag{color:var(--gold)}.empty{text-align:center;padding:50px 20px;color:#aaa}

<section class="welcome" id="welcome"><img class="logo" id="schoolLogo" alt="Teshie Technical Institute logo" src="school-logo.jpg" onerror="this.style.display='none'"><h1>TESHIE TECH REELS</h1><p class="muted">Your school. Your creativity. Your community.</p><button class="gold" id="enter">ENTER REELS</button><p class="muted" style="font-size:11px;margin-top:24px">A community made for creators</p></section>

<div id="authModal" class="welcome hidden" style="background:#080808"><div class="card" style="width:min(420px,90vw);text-align:left"><h2 id="authTitle">Welcome back</h2><input id="authEmail" class="field" type="email" placeholder="Email"><input id="authPassword" class="field" type="password" placeholder="Password"><input id="authName" class="field" placeholder="Display name (for sign up)"><div class="row"><button class="gold" id="authSubmit">Sign in</button><button id="switchAuth">Create account</button><button id="closeAuth">Close</button></div><p class="muted" id="authMessage"></p></div></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://ohkuzrcsekzebagwuniw.supabase.co',SUPABASE_ANON_KEY='sb_publishable_pLl2MB3T01QO6sKOvKmJLg_ICGzTk6V';
const supabase=SUPABASE_URL&&SUPABASE_ANON_KEY?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s);let user=null,posts=[],mode='signin',currentFeed='forYou',viewingProfileReels=false,followingIds=new Set();
$('#enter').onclick=()=>{$('#welcome').classList.add('hidden');$('#app').style.display='block';$('#nav').classList.remove('hidden');loadPosts();};
function notify(t){alert(t)}
async function loadPosts(){if(user){const {data:followRows}=await supabase.from('follows').select('following_id').eq('follower_id',user.id);followingIds=new Set((followRows||[]).map(x=>x.following_id))}else{followingIds=new Set()}if(!supabase){$('#feed').innerHTML='<div class="empty"><h2>Welcome to Teshie Tech Reels</h2><p>Connect Supabase to activate shared videos and accounts.</p><button class="gold" id="loginPrompt">Sign in / Register</button></div>';$('#loginPrompt').onclick=openAuth;return}
let q=supabase.from('videos').select('id,user_id,video_url,caption,tags,created_at,profiles(id,username,display_name,avatar_url)').order('created_at',{ascending:false});if(currentFeed==='following'&&user){const {data:f}=await supabase.from('follows').select('following_id').eq('follower_id',user.id);q=q.in('user_id',(f||[]).map(x=>x.following_id))}const {data,error}=await q;if(error){$('#feed').innerHTML='<div class="empty">Could not load videos.</div>';return}posts=data||[];renderFeed()}
let feedObserver=null;
function renderFeed(){
 const f=$('#feed');f.innerHTML='';
 if(viewingProfileReels){const back=document.createElement('button');back.className='profile-feed-back';back.textContent='← Back to profile';back.onclick=()=>{viewingProfileReels=false;showPage('profile');loadProfile()};f.append(back)}
 if(feedObserver){feedObserver.disconnect();feedObserver=null}
 if(!posts.length){f.innerHTML='<div class="empty">No videos yet. Be the first to upload!</div>';return}
 posts.forEach(p=>{
  const el=document.createElement('article');el.className='post';
  const v=document.createElement('video');v.src=p.video_url;v.playsInline=true;v.loop=true;v.muted=true;v.volume=1;v.preload='metadata';
  v.setAttribute('webkit-playsinline','');
  const overlay=document.createElement('div');overlay.className='overlay';
  overlay.innerHTML='<div class="creator">'+(p.profiles?.avatar_url?'<img class="avatar" src="'+esc(p.profiles.avatar_url)+'" alt="Creator photo">':'<span class="avatar">✦</span>')+'<span>@'+esc(p.profiles?.username||'creator')+'</span></div><p>'+esc(p.caption||'')+'</p><span class="tag">'+(p.tags||[]).map(t=>'#'+esc(t)).join(' ')+'</span>';
  const a=document.createElement('div');a.className='actions';
  const saved=JSON.parse(localStorage.getItem('ttr_saved')||'[]').includes(p.id);
  a.innerHTML='<button data-act="like">♡<small>Like</small></button><button data-act="share">↗<small>Share</small></button><button data-act="comments">▤<small>Comments</small></button><button data-act="save">'+(saved?'★':'☆')+'<small>'+(saved?'Saved':'Save')+'</small></button><button data-act="tag">#<small>Tags</small></button>'+(user?.id===p.user_id?'<button data-act="delete">⌫<small>Delete</small></button>':'<button data-act="follow">'+(followingIds.has(p.user_id)?'✓':'＋')+'<small>'+(followingIds.has(p.user_id)?'Following':'Follow')+'</small></button>');
  a.onclick=e=>action(e,p);
  const hint=document.createElement('div');hint.className='tap-hint';hint.textContent='Ⅱ';
  let lastTap=0;
  v.addEventListener('click',()=>{const now=Date.now();if(now-lastTap<280){const like=a.querySelector('[data-act="like"]');if(like)like.click();lastTap=0;return}v.muted=false;v.volume=1;if(v.paused)v.play().then(()=>el.classList.remove('paused')).catch(()=>{hint.textContent='Tap to play with sound';el.classList.add('paused')});else el.classList.remove('paused');lastTap=now});
  el.append(v,overlay,a,hint);f.append(el);
 });
 if('IntersectionObserver' in window){
  feedObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{const video=entry.target.querySelector('video');if(!video)return;if(entry.isIntersecting&&entry.intersectionRatio>=.65){document.querySelectorAll('.post video').forEach(other=>{if(other!==video)other.pause()});video.play().then(()=>entry.target.classList.remove('paused')).catch(()=>{})}else video.pause()}),{root:f,threshold:[.25,.65,.9]});
  f.querySelectorAll('.post').forEach(post=>feedObserver.observe(post));
 }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function action(e,p){const b=e.target.closest('button');if(!b)return;const act=b.dataset.act;if(!user&&['like','delete','follow'].includes(act)){openAuth();return}if(act==='comments'){openComments(p);return}if(act==='like'){const {data:old}=await supabase.from('likes').select('id').eq('video_id',p.id).eq('user_id',user.id).maybeSingle();if(old)await supabase.from('likes').delete().eq('id',old.id);else await supabase.from('likes').insert({video_id:p.id,user_id:user.id});b.firstChild.textContent=old?'♡':'♥'}if(act==='share'){if(navigator.share)await navigator.share({title:'Teshie Tech Reels',url:p.video_url});else{await navigator.clipboard.writeText(p.video_url);notify('Video link copied')}}if(act==='download'){const a=document.createElement('a');a.href=p.video_url;a.download='teshie-reel.mp4';a.target='_blank';a.click()}if(act==='save'){let saved=JSON.parse(localStorage.getItem('ttr_saved')||'[]');if(saved.includes(p.id)){saved=saved.filter(id=>id!==p.id);b.innerHTML='☆<small>Save</small>'}else{saved.push(p.id);b.innerHTML='★<small>Saved</small>'}localStorage.setItem('ttr_saved',JSON.stringify(saved));notify(saved.includes(p.id)?'Added to saved videos':'Removed from saved videos')}if(act==='tag')notify((p.tags||[]).map(t=>'#'+t).join(' ')||'No tags');if(act==='delete'&&confirm('Delete this video?')){const {error}=await supabase.from('videos').delete().eq('id',p.id);if(error)notify(error.message);else loadPosts()}if(act==='follow'){if(!user?.id){openAuth();return}const creatorId=p.user_id||p.profiles?.id;if(!creatorId){notify('This video is missing its creator profile. It cannot be followed until its owner is linked.');return}if(creatorId===user.id){notify('You cannot follow your own account.');return}const alreadyFollowing=followingIds.has(creatorId);const result=alreadyFollowing?await supabase.from('follows').delete().eq('follower_id',user.id).eq('following_id',creatorId):await supabase.from('follows').upsert({follower_id:user.id,following_id:creatorId},{onConflict:'follower_id,following_id',ignoreDuplicates:true});if(result.error){notify('Follow failed: '+result.error.message+' (code '+(result.error.code||'unknown')+').');return}if(alreadyFollowing)followingIds.delete(creatorId);else followingIds.add(creatorId);b.innerHTML=(alreadyFollowing?'＋':'✓')+'<small>'+(alreadyFollowing?'Follow':'Following')+'</small>';if(currentFeed==='following')await loadPosts();} }

let activeCommentVideo=null;
$('#closeComments').onclick=()=>$('#commentsModal').classList.add('hidden');
async function openComments(p){
 if(!supabase){notify('Comments need the Supabase connection.');return}
 activeCommentVideo=p;$('#commentsModal').classList.remove('hidden');$('#commentsTitle').textContent='Comments';$('#commentsList').textContent='Loading comments...';$('#commentInput').value='';
 const {data,error}=await supabase.from('comments').select('id,content,created_at,user_id,profiles(username,display_name)').eq('video_id',p.id).order('created_at',{ascending:true});
 const list=$('#commentsList');list.innerHTML='';
 if(error){list.textContent='Could not load comments. Check that the comments table has been created in Supabase.';return}
 if(!data?.length){list.textContent='No comments yet. Be the first to comment!';return}
 data.forEach(c=>{const item=document.createElement('div');item.className='comment-item';const name=document.createElement('strong');name.textContent='@'+(c.profiles?.username||c.profiles?.display_name||'user');const body=document.createElement('p');body.textContent=c.content;item.append(name,body);list.append(item)});
 list.scrollTop=list.scrollHeight;
}
$('#sendComment').onclick=async()=>{
 const content=$('#commentInput').value.trim();if(!content||!activeCommentVideo)return;
 if(!user){openAuth();return}
 const btn=$('#sendComment');btn.disabled=true;
 const {error}=await supabase.from('comments').insert({video_id:activeCommentVideo.id,user_id:user.id,content});
 btn.disabled=false;
 if(error){notify('Could not post comment: '+error.message);return}
 $('#commentInput').value='';await openComments(activeCommentVideo);
};
$('#commentInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sendComment').click()});

function openAuth(){$('#authModal').classList.remove('hidden')}
$('#accountBtn').onclick=openAuth;$('#closeAuth').onclick=()=>$('#authModal').classList.add('hidden');$('#switchAuth').onclick=()=>{mode=mode==='signin'?'signup':'signin';$('#authTitle').textContent=mode==='signin'?'Welcome back':'Create your account';$('#authSubmit').textContent=mode==='signin'?'Sign in':'Sign up';$('#authName').classList.toggle('hidden',mode==='signin');$('#switchAuth').textContent=mode==='signin'?'Create account':'I already have an account'};
$('#authSubmit').onclick=async()=>{if(!supabase){$('#authMessage').textContent='Backend is not connected yet. Follow the Supabase setup in README.';return}const email=$('#authEmail').value,password=$('#authPassword').value;let r=mode==='signup'?await supabase.auth.signUp({email,password,options:{data:{display_name:$('#authName').value}}}):await supabase.auth.signInWithPassword({email,password});$('#authMessage').textContent=r.error?.message||'Check your email if confirmation is enabled.';if(r.data.user){user=r.data.user;$('#accountBtn').textContent='Account';$('#authModal').classList.add('hidden');loadPosts();loadProfile()}};
if(supabase){const {data}=await supabase.auth.getSession();user=data.session?.user||null;supabase.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;$('#accountBtn').textContent=user?'Account':'Sign in';});}
$('#publish').onclick=async()=>{if(!supabase){notify('Connect Supabase first. See README.');return}if(!user){openAuth();return}const file=$('#videoFile').files[0];if(!file){notify('Choose a video first');return}if(file.size>100*1024*1024){notify('Please choose a video under 100 MB');return}$('#uploadStatus').textContent='Uploading...';const path=user.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');let {error}=await supabase.storage.from('reels').upload(path,file,{contentType:file.type});if(error){$('#uploadStatus').textContent=error.message;return}const {data:pub}=supabase.storage.from('reels').getPublicUrl(path);const tags=$('#hashtags').value.split(/[ ,#]+/).filter(Boolean);({error}=await supabase.from('videos').insert({user_id:user.id,video_url:pub.publicUrl,caption:$('#caption').value,tags}));$('#uploadStatus').textContent=error?.message||'Video published!';if(!error){$('#videoFile').value='';$('#caption').value='';$('#hashtags').value='';showPage('feed');loadPosts()}};
function showPage(page){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));if(page==='feed'){$('#feed').classList.remove('hidden');$('#feed').style.display='block'}else{$('#'+page).classList.remove('hidden');$('#feed').style.display='none'}document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{currentFeed=b.dataset.feed;document.querySelectorAll('[data-feed]').forEach(x=>x.classList.toggle('active',x===b));loadPosts()});
let discoverPosts=[];
function renderDiscoverVideos(list){
 discoverPosts=list||[];
 const results=$('#discoverResults');
 const old=results.querySelector('#discoverVideoResults');
 if(old)old.remove();
 const section=document.createElement('div');section.id='discoverVideoResults';
 const heading=document.createElement('h3');heading.textContent='Videos';section.append(heading);
 if(!discoverPosts.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No videos found for this search.';section.append(empty);results.append(section);return}
 discoverPosts.forEach((post,index)=>{
  const card=document.createElement('button');card.type='button';card.className='card';card.style='width:100%;display:flex;gap:12px;align-items:center;text-align:left;color:white;margin:10px 0;padding:10px';
  const thumb=document.createElement('video');thumb.src=post.video_url;thumb.muted=true;thumb.playsInline=true;thumb.preload='metadata';thumb.style='width:104px;height:138px;object-fit:cover;border-radius:10px;background:#222;flex:0 0 104px';
  const details=document.createElement('div');details.style='min-width:0';
  const creator=document.createElement('strong');creator.textContent='@'+(post.profiles?.username||post.profiles?.display_name||'creator');
  const caption=document.createElement('p');caption.style='margin:7px 0;color:#ddd;overflow-wrap:anywhere';caption.textContent=post.caption||'Video';
  const tags=document.createElement('small');tags.style='color:var(--gold)';tags.textContent=(post.tags||[]).map(t=>'#'+t).join(' ');
  const watch=document.createElement('p');watch.style='margin:10px 0 0;color:var(--gold);font-weight:800';watch.textContent='▶  Watch video';
  details.append(creator,caption,tags,watch);card.append(thumb,details);
  card.onclick=()=>{
   posts=discoverPosts.slice();viewingProfileReels=false;showPage('feed');renderFeed();
   const target=$('#feed').querySelectorAll('.post')[index];
   if(target){target.scrollIntoView({block:'start'});const video=target.querySelector('video');video.muted=true;video.play().catch(()=>{})}
  };
  section.append(card);
 });
 results.append(section);
}
$('#search').oninput=async()=>{
 if(!supabase)return;
 const term=$('#search').value.trim().replace(/^#/,'').replace(/[(),]/g,' ').trim();
 const results=$('#discoverResults');
 if(!term){discoverPosts=[];results.innerHTML='<p class="muted">Search for creators, captions or hashtags to find videos.</p>';return}
 results.innerHTML='<p class="muted">Searching creators and videos...</p>';
 const [people,videos]=await Promise.all([
  supabase.from('profiles').select('id,username,display_name,avatar_url').or('username.ilike.%'+term+'%,display_name.ilike.%'+term+'%').limit(20),
  supabase.from('videos').select('id,user_id,video_url,caption,tags,created_at,profiles(id,username,display_name,avatar_url)').or('caption.ilike.%'+term+'%,tags.cs.{'+term+'}').order('created_at',{ascending:false}).limit(30)
 ]);
 if(people.error&&videos.error){results.textContent='Search failed: '+people.error.message;return}
 results.innerHTML='';
 const users=people.data||[];
 if(users.length){
  const heading=document.createElement('h3');heading.textContent='Creators';results.append(heading);
  users.forEach(person=>{
   const card=document.createElement('button');card.type='button';card.className='card';card.style='width:100%;display:flex;gap:12px;align-items:center;text-align:left;color:white;margin:8px 0;padding:12px';
   if(person.avatar_url){const avatar=document.createElement('img');avatar.src=person.avatar_url;avatar.alt='';avatar.style='width:48px;height:48px;border-radius:50%;object-fit:cover';card.append(avatar)}
   const info=document.createElement('span');info.style='display:block;min-width:0';
   const name=document.createElement('strong');name.textContent=person.display_name||person.username||'Creator';
   const handle=document.createElement('small');handle.className='muted';handle.style='display:block';handle.textContent='@'+(person.username||'creator')+' · View videos';
   info.append(name,handle);card.append(info);
   card.onclick=async()=>{
    results.innerHTML='<p class="muted">Loading videos from @'+(person.username||'creator')+'...</p>';
    const {data,error}=await supabase.from('videos').select('id,user_id,video_url,caption,tags,created_at,profiles(id,username,display_name,avatar_url)').eq('user_id',person.id).order('created_at',{ascending:false}).limit(30);
    if(error){results.textContent='Could not load this creator: '+error.message;return}
    results.innerHTML='';
    const back=document.createElement('button');back.textContent='← Back to search results';back.onclick=()=>$('#search').dispatchEvent(new Event('input'));results.append(back);
    const title=document.createElement('h3');title.textContent=(person.display_name||person.username||'Creator')+' videos';results.append(title);
    renderDiscoverVideos(data||[]);
   };
   results.append(card);
  });
 }else{
  const noPeople=document.createElement('p');noPeople.className='muted';noPeople.textContent='No creators matched this search.';results.append(noPeople);
 }
 if(videos.error){const err=document.createElement('p');err.className='muted';err.textContent='Video search unavailable: '+videos.error.message;results.append(err)}else renderDiscoverVideos(videos.data||[]);
};
async function loadProfile(){
 if(!supabase||!user)return;
 const {data:p,error:profileError}=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(profileError){$('#profileContent').textContent='Could not load your profile: '+profileError.message;return}
 const {count}=await supabase.from('videos').select('*',{count:'exact',head:true}).eq('user_id',user.id);
 const avatar=p?.avatar_url?'<img class="profile-avatar" src="'+esc(p.avatar_url)+'" alt="Your profile photo or logo">':'<div class="avatar-placeholder">✦</div>';
 $('#profileContent').innerHTML='<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px">'+avatar+'</div><h2>'+(esc(p?.display_name||user.email))+'</h2><p class="muted">@'+esc(p?.username||'newcreator')+'</p><p>'+(count||0)+' videos</p><label class="gold" for="avatarFile" style="display:inline-block;cursor:pointer">Choose photo or logo</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="field" style="margin-top:14px"><button class="gold" id="uploadAvatar" style="margin-top:8px">Save profile photo</button><p class="muted" id="avatarStatus">JPG, PNG, WEBP or GIF. Maximum 5 MB.</p></div><button class="gold" id="logout">Log out</button><div class="videoGrid" id="myVideos"></div>';
 $('#uploadAvatar').onclick=uploadAvatar;
 $('#logout').onclick=async()=>{await supabase.auth.signOut();user=null;viewingProfileReels=false;$('#accountBtn').textContent='Sign in';loadPosts();showPage('feed')};
 const {data:v,error}=await supabase.from('videos').select('id,video_url,caption,tags,created_at,profiles(username,display_name)').eq('user_id',user.id).order('created_at',{ascending:false});
 const grid=$('#myVideos');if(error){grid.textContent='Could not load your videos.';return}
 grid.innerHTML=(v||[]).map((x,i)=>'<button class="profile-tile" data-video-index="'+i+'"><video src="'+x.video_url+'" muted playsinline preload="metadata"></video><span>▶</span></button>').join('');
 grid.querySelectorAll('[data-video-index]').forEach(btn=>btn.onclick=()=>{posts=v;viewingProfileReels=true;showPage('feed');renderFeed();const index=Number(btn.dataset.videoIndex);const target=$('#feed').querySelectorAll('.post')[index];if(target){target.scrollIntoView({block:'start'});const video=target.querySelector('video');video.muted=true;video.play().catch(()=>{})}});
}
async function uploadAvatar(){
 if(!user){openAuth();return}
 const file=$('#avatarFile')?.files?.[0];const status=$('#avatarStatus');const btn=$('#uploadAvatar');
 if(!file){status.textContent='Choose a photo or logo first.';return}
 if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){status.textContent='Please choose a JPG, PNG, WEBP or GIF image.';return}
 if(file.size>5*1024*1024){status.textContent='That image is larger than 5 MB. Choose a smaller image.';return}
 btn.disabled=true;status.textContent='Uploading your profile image...';
 const ext=({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif' })[file.type];
 const path=user.id+'/profile.'+ext;
 const {error:uploadError}=await supabase.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});
 if(uploadError){status.textContent='Upload failed: '+uploadError.message;btn.disabled=false;return}
 const {data:publicData}=supabase.storage.from('avatars').getPublicUrl(path);
 const avatarUrl=publicData.publicUrl+'?v='+Date.now();
 const {error:updateError}=await supabase.from('profiles').update({avatar_url:avatarUrl}).eq('id',user.id);
 btn.disabled=false;
 if(updateError){status.textContent='Image uploaded, but profile update failed: '+updateError.message;return}
 status.textContent='Profile photo or logo saved!';
 await loadProfile();
 await loadPosts();
}
$('#nav button[data-page="profile"]').addEventListener('click',loadProfile);$('#nav button[data-page="activity"]').onclick=async()=>{if(!user){$('#activityList').textContent='Sign in to view your activity.';return}const {data}=await supabase.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(30);$('#activityList').innerHTML=(data||[]).map(n=>'<p>'+esc(n.message)+'</p>').join('')||'No activity yet.'};
</script></body></html>
